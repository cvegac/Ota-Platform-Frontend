<div class="welcome-container">
  <div class="welcome-header text-center mb-5">
    <div class="icon-circle mb-4 mx-auto">
      <i class="bi bi-stars"></i>
    </div>
    <h1 class="welcome-title">Bienvenido, <span class="highlight">{{currentUser()?.name}}</span></h1>
    <p class="welcome-subtitle">Comencemos configurando tu primer proyecto para gestionar tus dispositivos.</p>
  </div>

  <div class="form-wrapper shadow-lg mx-auto">
    <div class="form-header text-center p-4">
      <h3 class="m-0 fw-bold">Nuevo Proyecto</h3>
      <p class="text-muted small m-0">Define el nombre y descripción de tu entorno</p>
    </div>
    <div class="p-4 bg-white rounded-bottom">
      <project-form (projectCreated)="onProjectCreated($event)"></project-form>
    </div>
  </div>
</div>
