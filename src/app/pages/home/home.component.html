<div class="page">
  <header>
    <div class="row header align-items-center">
      <div class="col-auto d-flex align-items-center gap-2">
        <i class="bi bi-cpu fs-4 text-white-50"></i>
        <span class="fs-5 fw-bold brand-text">Embedded Platform</span>
      </div>
      <div class="col text-end">
        @if (currentUser()) {
          <span class="me-3 fs-6 opacity-75">
            <i class="bi bi-person-circle me-1"></i>
            {{ currentUser()!.name }}
          </span>
        }
        <button class="btn btn-outline-light btn-sm" (click)="logout()">
          <i class="bi bi-box-arrow-right me-1"></i>
          Salir
        </button>
      </div>
    </div>
  </header>
  <div class="content">
      <div class="target">
        <router-outlet />
      </div>
  </div>
</div>
