@if (submitStatus !== sevicesStatus.SUCCESS) {
  <form [formGroup]="projectForm" (ngSubmit)="onSubmit()" class="p-4 rounded shadow-sm bg-white">
    <div class="row mb-3">
      <div class="col">
        <label for="name" class="form-label fw-bold">Nombre del proyecto</label>
        <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ej: Plataforma IoT" />
      </div>
      <div class="col">
        <label for="description" class="form-label fw-bold">Descripción</label>
        <input type="text" id="description" formControlName="description" class="form-control" placeholder="Descripción breve" />
      </div>
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="!projectForm.valid">Crear proyecto</button>
    </div>
  </form>
  @if (statusMessage === sevicesStatus.ERROR) {
    <div class="alert alert-danger mt-3">
      {{ statusMessage }}
    </div>
  }
}@else {
  <div class="alert alert-success mt-3">
    {{ statusMessage }}
  </div>
}
