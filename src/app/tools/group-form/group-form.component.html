@if (submitStatus !== sevicesStatus.SUCCESS) {
  <form [formGroup]="groupForm" (ngSubmit)="onSubmit()" class="p-4 rounded shadow-sm bg-white">
    <div class="mb-3">
      <label for="project" class="form-label fw-bold">Proyecto</label>
      <app-select [options]="projectOptions" placeholder="Selecciona un proyecto" formControlName="project"></app-select>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label fw-bold">Nombre del grupo</label>
      <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ej: Grupo de sensores" />
    </div>
    <div class="mb-3">
      <label for="description" class="form-label fw-bold">Descripción</label>
      <input type="text" id="description" formControlName="description" class="form-control" placeholder="Descripción breve" />
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="!groupForm.valid">Crear grupo</button>
    </div>
  </form>
  @if (statusMessage && submitStatus === sevicesStatus.ERROR) {
    <div class="alert alert-danger mt-3">
      {{ statusMessage }}
    </div>
  }
}@else {
  <div class="alert alert-success mt-3">
    {{ statusMessage }}
  </div>
}
