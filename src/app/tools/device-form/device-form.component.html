@if (submitStatus !== sevicesStatus.SUCCESS) {
  <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()" class="p-4 rounded shadow-sm bg-white">
    <div class="mb-3">
      <label for="project" class="form-label fw-bold">Proyecto</label>
      <app-select [options]="projects()" placeholder="Selecciona un proyecto" formControlName="project"></app-select>
    </div>
    <div class="mb-3">
      <label for="group" class="form-label fw-bold">Grupo</label>
      <app-select [options]="groups()" placeholder="Selecciona un grupo" formControlName="group"></app-select>
    </div>
    <div class="mb-3">
      <label for="name" class="form-label fw-bold">Nombre del dispositivo</label>
      <input type="text" id="name" formControlName="name" class="form-control" placeholder="Ej: Sensor 1" />
    </div>
    <div class="mb-3">
      <label for="description" class="form-label fw-bold">Descripción</label>
      <input type="text" id="description" formControlName="description" class="form-control" placeholder="Descripción breve" />
    </div>
    <div class="d-flex justify-content-end">
      <button type="submit" class="btn btn-primary" [disabled]="!deviceForm.valid">Crear dispositivo</button>
    </div>
  </form>
  @if (statusMessage && submitStatus === sevicesStatus.ERROR) {
    <div class="alert alert-danger mt-3">
      {{ statusMessage }}
    </div>
  }
}@else {
  <div class="alert alert-success mt-3">
    {{ statusMessage }}
  </div>
}
